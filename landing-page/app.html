<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poly-Alpha | Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030303;
            --bg-surface: #0a0a0b;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #ededed;
            --text-secondary: #a1a1aa;
            --primary-color: #2dd4bf;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 3rem;
            background: linear-gradient(to bottom right, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            text-align: center;
        }

        .logo {
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .logo img {
            height: 32px;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn:hover { background: #e5e5e5; }
        
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
        }
        
        .back-link:hover {
            color: #fff;
        }

        .background-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(45, 212, 191, 0.02) 0%, rgba(0,0,0,0) 60%);
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="background-glow"></div>
    <div class="auth-container">
        <div class="logo">
            <img src="assets/logo.png" alt="Poly-Alpha Logo" onerror="this.style.display='none'">
            <span class="logo-text">Poly-Alpha</span>
        </div>
        <h1>Institutional Portal</h1>
        <p>Sign in to access your quantitative dashboard</p>
        
        <form onsubmit="event.preventDefault();">
            <div class="form-group">
                <label>Institutional Email</label>
                <input type="email" placeholder="name@fund.com" required>
            </div>
            <div class="form-group">
                <label>API Deployment Key</label>
                <input type="password" placeholder="••••••••••••••••" required>
            </div>
            <button type="submit" class="btn">Authenticate</button>
        </form>
        
        <a href="index.html" class="back-link">&larr; Back to Platform</a>
    </div>
</body>
</html>
