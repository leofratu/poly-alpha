[project]
name = "poly-alpha"
version = "1.0.0"
description = "Provenance-first research and paper-trading platform for prediction-market strategies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "python-dateutil>=2.9",
    "requests>=2.31",
    "rich>=13.7",
    "typer>=0.12",
    "yfinance>=0.2",
]

[project.optional-dependencies]
live = ["web3>=6.0", "py-clob-client>=0.1"]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-requests>=2.31",
]

[project.scripts]
poly-alpha = "poly_alpha.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poly_alpha"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501", "N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["poly_alpha"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yfinance.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
